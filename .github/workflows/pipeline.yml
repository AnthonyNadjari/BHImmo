name: Data pipeline

# Refreshes the dataset from real open data and commits the JSON back to the
# repo. Scheduled once a day (DVF is released twice a year; the other sources
# — rent control, DPE, Vélib', OSM… — move more often), plus manual dispatch.
# If DVF can't be downloaded the run fails and nothing is committed: the last
# real dataset stays online. No synthetic fallback exists.
on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:

# Never run two pipeline updates concurrently on the same branch.
concurrency:
  group: pipeline-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install pipeline dependencies
        run: npm ci

      - name: Run pipeline
        env:
          # Most recent real DVF sales surfaced per arrondissement (1000 total).
          PRER_DVF_PER_ARR: "50"
          # Optional: real street-level photos baked into the dataset (free).
          MLY_TOKEN: ${{ secrets.MLY_TOKEN }}
        run: npm run pipeline

      - name: Commit updated dataset
        run: |
          git config user.name "prer-bot"
          git config user.email "prer-bot@users.noreply.github.com"
          if [ -n "$(git status --porcelain data)" ]; then
            git add data
            git commit -m "data: scheduled refresh $(date -u +%Y-%m-%dT%H:%MZ)"
            git push origin HEAD:${{ github.ref_name }}
          else
            echo "No dataset changes to commit."
          fi
